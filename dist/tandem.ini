; tandem: co-op for Cyberpunk 2077
;
; Solo by default: without a session tandem does nothing to your game (it
; plays as without it). The Co-op entry of the main menu and the pause menu
; hosts or joins a session; leaving it is solo again.
;
; role = off   solo: no session until you pick one in the Co-op menu
; role = host  your game hosts the session at every load; friends join your
;              address, or your join code when you set a relay (the Co-op
;              menu and tandem's log show it)
; role = join  join the host at `address`, or by its join code (`join`), at
;              every load
role = off
; recorder = on  record your play (solo or in a session) for tandem's tests,
;              in recordings/auto/ next to this file: 10-minute segments, the
;              oldest deleted past recorder_max_mb. It changes nothing in game.
recorder = off
; recorder_max_mb = 2048   recorder_segment_minutes = 10   recorder_pose = off
address = 127.0.0.1
port = 27450
name = V
; Across the internet, when NAT keeps you apart: a tandem-relay. Both sides
; set it; the host also needs one of its host tokens.
; relay = relay.example.org:27460
; relay_token = 64 hex digits from `tandem-relay token`
; join = K7Q-2M9   the host's join code (valid 10 minutes); with it, the
;                  address above is tried first only if you wrote one
; pose = off  stop streaming body poses (on by default)
; story = off  no story sync (on by default: the host's journal, calls,
;              texts, subtitles, choice hubs and quest rewards reach guests)
; quest_freeze = on  (guest) your own story waits while you play in the
;              host's; needed for its journal and texts to be mirrored.
;              Off by default until checked in game.
; scene_privacy = off  every scene can be watched (on by default: romance
;              and minor one-to-one scenes are private: the others see you busy)
; private_actors = judy, panam, river, kerry, meredith  romance partners
;              (scene actor names); private_scenes / public_scenes = <paths>
; quest_freeze_allow = <resource path>, ...  more open-world phases that
;              keep running while frozen
; time_host = bubble  host only: your own Sandevistan slows only the NPCs around
;                   you, not your whole game (effects, physics, sound). By default
;                   (full) your game slows exactly as in single player; the other
;                   players never do
