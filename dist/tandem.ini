; tandem: co-op for Cyberpunk 2077
;
; You do not need to edit this file to play. With everything left as it is,
; tandem does nothing until you pick Host or Join in the Co-op entry of the
; main menu or of the pause menu. Edit it for your name, a relay, or to
; change how co-op behaves. Lines starting with ';' are comments; the game
; reads the file when it starts. INSTALL.md explains each key at length.
;
; This file is yours: a new release never replaces it (it ships its
; defaults as tandem.default.ini).

; ---- You ----

; The name the other players see.
name = V

; ---- The session ----

; off   solo. Nothing is shared and nothing changes in your game until you
;       start a session from the Co-op menu. The default.
; host  host a session every time a save loads, without the menu.
; join  join `address` (or the join code in `join`) every time a save loads.
role = off

; The UDP port a host listens on, and the port a guest calls. A host behind
; a router forwards this port (UDP) to play across the internet without a
; relay.
port = 27450

; role = join only: the host's address (the Co-op menu asks for it otherwise).
; address = 192.168.1.20

; ---- Across the internet, without a port forward: a relay ----

; A tandem-relay that you or a friend runs (docs/relay.md in the source).
; Both players set the same relay; hosting also needs one of its host
; tokens. With a relay set, a host gets a join code (K7Q-2M9) in the Co-op
; menu, and a guest types it there.
; relay = relay.example.org:27460
; relay_token = 64 hex digits, from `tandem-relay token`
; role = join only: the host's join code (it lasts 10 minutes).
; join = K7Q-2M9

; ---- What is shared ----

; Body poses of the other players (their exact animation). off: they move
; with the game's stock animations only.
; pose = on

; The story: the host's journal, calls, texts, subtitles, dialogue choices
; and quest rewards reach the guests. off: each game keeps its own story.
; story = on

; Guest only: your own story waits while you play in the host's. Off until
; it has been tested more.
; quest_freeze = off
; More open-world quest phases that keep running while frozen (resource
; paths, comma-separated).
; quest_freeze_allow =
; Gig phases: they wait only while you are grouped with the host (always,
; for now; resource paths, comma-separated).
; quest_freeze_gigs =

; Romance and private one-to-one scenes are yours alone: the other players
; see you busy, not the scene. off: every scene can be watched.
; scene_privacy = on
; Whose scenes are private (scene actor names), and scenes to force either
; way (resource paths, comma-separated).
; private_actors = judy, panam, river, kerry, meredith
; private_scenes =
; public_scenes =
; on: the host's story scenes play for its guests: the actors' bodies,
; their voices in your language, Johnny. noposes: all but the bodies. Off
; until it has been tested in game.
; scene_replay = off

; Host only: your own Sandevistan. full: your game slows down as in single
; player. bubble: only the NPCs around you slow down, your game does not.
; time_host = full

; ---- Progression: levels, cars, trade, leaving ----

; Guest only: once you are out of a session and your own world is back.
; stay: go on in place (the next save is yours or the game's). save: make
; one quick save, so what your V earned is safe at once. reload: that save,
; then load it when you chose to leave (your world is rebuilt from it).
; leave = stay
; Guest only: a vehicle a quest or gig gives the host while you took part.
; credit: only noted as earned. keep: unlocked in your own garage too.
; vehicle_rewards = credit
; Who may drive your cars: crew, any partner in the session (with you aboard
; or not); owner, only a partner riding with you; never, nobody but you.
; Your garage stays yours.
; lend = crew
; on: trade items and eddies with the player standing beside you (the
; interaction prompt on them, out of combat). Off until checked in game:
; requests are refused.
; trade = off

; ---- What you see and hear ----
; The Co-op menu's Settings page changes these (and the name, the recorder,
; the relay, the story options) and saves them here as they change.

; Host only, for the whole session: the Vs' shots, blades and explosions
; hurt each other. Off: a partner is never hurt by your V, as vanilla's
; companions are not. Every game plays by the host's (a guest's page
; shows it).
; friendly_fire = off
; all: every notice. important: no news (rides, calls, pauses...). minimal:
; only what asks for an answer or went wrong.
; notices = all
; A marker for each other player (HUD, minimap, map), and a name over them.
; markers = on
; nameplates = on
; Who sees your scanner tags and Ping quickhack reveals. auto: every
; partner, until either of you breaks it (aim at their V and press the tag
; key, the middle mouse button); ask: only partners you link with that way
; (they accept); off: nobody.
; link = auto
; off: neither send nor see pings (the tag key outside the scanner marks
; what you look at for everyone).
; pings = on

; ---- Recording your play, for tandem's developers ----

; on: record what your game plays (solo or in a session) in recordings/auto/
; next to this file, for tandem's tests. It changes nothing in game; the
; Co-op menu shows it and switches it until the game closes.
; recorder = off
; Megabytes kept: past this the oldest segments are deleted.
; recorder_max_mb = 2048
; Minutes per recorded segment.
; recorder_segment_minutes = 10
; Also record body poses (larger files).
; recorder_pose = off

; ---- Developers only ----
; Nothing below is needed to play. These change what tandem does to the
; game for testing, and can crash it or flood the log.

; The puppet records the other players are spawned from (tweaks/tandem).
; puppet_female = Character.TandemPuppetWa
; puppet_male = Character.TandemPuppetMa
; Spawn test bodies and log their animation setup.
; probe = off
; Log every distinct animation feature the engine applies.
; trace = off
; Experiment: puppets get the local V's animation features.
; mirror = off
; off: start sessions whatever the startup check found (another game
; version, an older Codeware or TweakXL). Expect crashes.
; compat = on
