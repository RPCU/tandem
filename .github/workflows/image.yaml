name: Image

# Builds and pushes the relay's image, zot.rpcu.io/public/tandem-relay:<tag>,
# where <tag> is the git tag for tag pushes and the 8-char commit SHA
# otherwise. relay/Dockerfile builds the same image as nix/relay-image.nix
# (static binary, no shell, user 65532); nix-build.yaml checks the Nix one.
on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: zot.rpcu.io/public/tandem-relay

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          TAGS="${IMAGE}:${SHORT_SHA}"
          VERSION="${SHORT_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${IMAGE}:${GITHUB_REF_NAME},${TAGS}"
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: zot.rpcu.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: relay
          file: relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=tandem-relay
            org.opencontainers.image.description=UDP relay for tandem co-op sessions behind NAT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
