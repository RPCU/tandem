name: CI

# What can run without the game or the Windows sysroot. The plugin
# (tandem.dll) is not built here yet. `task scripts:check` compiles scripts/
# against the game's own scripts and other mods' (on the game machine): it
# cannot run here.
on:
  push:
  pull_request:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [relay, tools/pilot]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false # standard library only: no go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        if: matrix.module == 'relay'
        run: CGO_ENABLED=0 go build -trimpath -o tandem-relay ./cmd/tandem-relay

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install kustomize and kubeconform
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.3
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      # task k8s:check. Gateway and HTTPRoute (Gateway API CRDs) have no
      # schema kubeconform ships: rendered, not validated.
      - name: Render and validate the base and the overlays
        run: |
          set -o pipefail
          kustomize build deploy/kubernetes/base | kubeconform -strict -summary -
          kustomize build deploy/kubernetes/kgateway | kubeconform -strict -summary -skip Gateway,HTTPRoute -
          kustomize build deploy/kubernetes/playit | kubeconform -strict -summary -

  core:
    name: core tests (Linux)
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # the build is named after the commit (core/CMakeLists.txt)

      # Swap, ccache, CMAKE_BUILD_PARALLEL_LEVEL from the runner's memory.
      - uses: ./.github/actions/build-host

      # relay-loopback builds the relay with Go and runs sessions through it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: relay/go.mod
          cache: false

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build

      # A new key each run, the newest earlier one restored: the cache
      # follows the tree. Saved even when the build fails, so a rerun
      # starts from what did compile.
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-

      # task test
      - name: Configure
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux

      - name: Test
        run: ctest --preset linux

      - uses: ./.github/actions/build-report
        if: ${{ !cancelled() }}

      - uses: actions/cache/save@v6
        if: ${{ !cancelled() }}
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-${{ github.run_id }}-${{ github.run_attempt }}

  checks:
    name: docs, natives, strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # task docs:check (links only: the facts check compares with HEAD)
      - name: Docs links
        run: python3 tools/docs-check.py links

      # task natives:check
      - name: Natives.reds matches natives.cpp
        run: python3 tools/check-natives.py

      # task strings:check
      - name: Player-facing strings
        run: python3 tools/check-strings.py
