apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The relay's StatefulSet alone. The base includes it once (every replica
# one StatefulSet); the edge overlay once per replica, each pinned to its
# node (../../edge).
resources:
  - statefulset.yaml

images:
  - name: tandem-relay
    newTag: 0.1.0
