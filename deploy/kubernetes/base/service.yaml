# Players reach the relay over UDP from the internet.
apiVersion: v1
kind: Service
metadata:
  name: tandem-relay
spec:
  type: LoadBalancer
  # Keep the players' own addresses: the relay knows a client by its address
  # and port, and rate-limits per client.
  externalTrafficPolicy: Local
  ports:
    - name: game
      port: 27460
      targetPort: game
      protocol: UDP
---
# Health and metrics stay inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: tandem-relay-metrics
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
