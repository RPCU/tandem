apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The relay alone. An overlay sets the namespace, the image registry and the
# load balancer annotations, and provides the host-token Secret (SOPS, an
# external secret operator...): see docs/architecture/relay.md.
labels:
  - pairs:
      app.kubernetes.io/name: tandem-relay
      app.kubernetes.io/part-of: tandem
    includeSelectors: true

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

images:
  - name: tandem-relay
    newTag: 0.1.0
